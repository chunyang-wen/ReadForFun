<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宋词之境 · 词画合集 · 句号画意与互动赏析</title>
  <meta name="description" content="精选100首宋代传世经典名篇，字字精准拼音，上阕与下阕分别配图，以句号/问号/感叹号为画意单元，专属宋代水墨意境配图与白话详释。全新设计键盘联动：上下键逐句联动、Tab键跨阕跳转、左右键切换词作。">
  <link rel="stylesheet" href="style.css?v=20260919-loading-state">
</head>
<body class="theme-paper pinyin-enabled">

  <!-- Ambient Paper & Ink Texture -->
  <div class="paper-texture" aria-hidden="true"></div>

  <!-- App Header & Navigation -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-section">
        <a href="../" class="bookshelf-back" title="返回 ReadForFun 故事书架">
          <span class="back-arrow">←</span>
          <span class="back-text">书架</span>
        </a>
        <div class="brand-seal" aria-hidden="true">宋</div>
        <div class="brand-titles">
          <h1>宋词之境</h1>
          <span class="brand-sub">词画合集 · 百首传世名篇</span>
        </div>
      </div>

      <!-- Search Input Container -->
      <div class="search-section">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input 
            type="search" 
            id="searchInput" 
            class="search-input" 
            placeholder="搜索词牌、作者或词句（如：水调歌头、苏轼、千里共婵娟）" 
            autocomplete="off"
            aria-label="搜索宋词"
          >
          <button type="button" id="clearSearchBtn" class="clear-search-btn" title="清空搜索" aria-label="清空">✕</button>
          <kbd class="search-shortcut" title="按 / 键快速聚焦搜索">/</kbd>
        </div>

        <!-- Search Live Results Dropdown -->
        <div id="searchResultsPanel" class="search-results-panel" hidden>
          <div class="search-results-header">
            <span id="searchResultCount">输入关键词即可检索</span>
            <span class="search-tip">支持词牌、作者、词句及拼音搜索</span>
          </div>
          <div id="searchResultsList" class="search-results-list" role="listbox"></div>
        </div>
      </div>

      <!-- Header Action Controls -->
      <div class="header-actions">
        <!-- Game Mode Toggle -->
        <button type="button" id="gameModeToggleBtn" class="action-btn mode-toggle-btn" title="切换背诵挑战模式 (快捷键 G)" aria-pressed="false">
          <span class="btn-icon">🎯</span>
          <span class="btn-label" id="gameModeBtnLabel">背诵挑战</span>
        </button>

        <!-- Pinyin Toggle -->
        <button type="button" id="pinyinToggleBtn" class="action-btn" title="切换拼音标注 (快捷键 P)" aria-pressed="true">
          <span class="btn-icon">pī</span>
          <span class="btn-label">拼音</span>
        </button>

        <!-- Catalog Drawer Button -->
        <button type="button" id="catalogBtn" class="action-btn" title="打开词集全览目录 (快捷键 M)">
          <span class="btn-icon">卷</span>
          <span class="btn-label">全卷 (100)</span>
        </button>

        <!-- Random Ci Button -->
        <button type="button" id="randomCiBtn" class="action-btn" title="随机漫游一首词 (快捷键 R)">
          <span class="btn-icon">🎲</span>
          <span class="btn-label">随机</span>
        </button>

        <!-- Theme Toggle -->
        <button type="button" id="themeToggleBtn" class="action-btn" title="切换宣纸白昼/幽夜静思模式">
          <span class="btn-icon theme-icon">🌙</span>
        </button>
      </div>
    </div>

    <!-- Author Filter Chips Bar -->
    <nav class="author-filter-bar" aria-label="按词人检索">
      <div class="filter-label">词人检索：</div>
      <div id="authorChipsContainer" class="author-chips-scroll">
        <!-- Dynamic chips generated by app.js -->
      </div>
    </nav>
  </header>

  <!-- Main Ci Reader Stage -->
  <main class="reader-stage" id="readerStage">
    
    <!-- Left Column: Ci Lyrics, Stanzas & Interactive Sentences -->
    <section class="lyrics-column" id="lyricsColumn">
      <article class="ci-card">
        
        <!-- Ci Header -->
        <div class="ci-header">
          <div class="ci-badge-row">
            <span class="ci-dynasty-badge" id="ciDynastyBadge">宋代</span>
            <span class="ci-form-badge" id="ciFormBadge">双调</span>
            <span class="poem-mastery-badge" id="poemMasteryBadge" hidden></span>
            <span class="ci-tags-list" id="ciTagsList"></span>
          </div>
          
          <h2 class="ci-title" id="ciTitle">
            <!-- Rendered with ruby pinyin by app.js -->
          </h2>
          
          <div class="ci-author-row">
            <span class="author-name" id="authorName"></span>
            <span class="author-seal" id="authorSeal">印</span>
          </div>

          <!-- Optional Ci Preface (小序) -->
          <div class="ci-preface" id="ciPreface" hidden>
            <div class="preface-label">【小序】</div>
            <div class="preface-text" id="ciPrefaceText"></div>
          </div>
        </div>

        <!-- Quiz Control & Action Bar (Visible only in Quiz Mode) -->
        <div class="quiz-control-bar" id="quizControlBar" hidden>
          <div class="quiz-modes-row">
            <div class="quiz-mode-selector">
              <button type="button" class="quiz-tab-btn active" data-quiz-mode="title_only">
                <span class="tab-icon">🎴</span> 纯标题自测
              </button>
              <button type="button" class="quiz-tab-btn" data-quiz-mode="context_mask">
                <span class="tab-icon">🧩</span> 上下文接龙
              </button>
            </div>

            <!-- Context Mask Sub-options -->
            <div class="quiz-suboptions" id="quizSubOptions" hidden>
              <span class="subopt-label">出题：</span>
              <div class="subopt-pills" id="suboptPills">
                <button type="button" class="subopt-pill active" data-rule="stanza">上阕/下阕</button>
                <button type="button" class="subopt-pill" data-rule="half">随机半首</button>
                <button type="button" class="subopt-pill" data-rule="next_line">出上句背下句</button>
              </div>
            </div>
          </div>

          <!-- Action Buttons Bar in Quiz -->
          <div class="quiz-action-bar">
            <button type="button" id="quizHintBtn" class="quiz-btn quiz-btn-hint" title="锦囊提示 (快捷键 H)">
              <span class="btn-icon">💡</span> 锦囊提示 <kbd class="quiz-kbd">H</kbd>
            </button>
            <button type="button" id="quizRevealBtn" class="quiz-btn quiz-btn-reveal" title="翻开核对答案 (快捷键 空格)">
              <span class="btn-icon">📜</span> <span id="quizRevealBtnText">翻开核验</span> <kbd class="quiz-kbd">Space</kbd>
            </button>
            <button type="button" id="quizRerollBtn" class="quiz-btn quiz-btn-secondary" title="换一题 (快捷键 R)">
              <span class="btn-icon">🎲</span> 换题 <kbd class="quiz-kbd">R</kbd>
            </button>
            <span class="quiz-tip-badge">按 <kbd class="quiz-kbd">↓</kbd> / <kbd class="quiz-kbd">↑</kbd> 移至词句自动解锁</span>
          </div>

          <!-- Mastery Self-Assessment Bar (Shown upon reveal in quiz mode) -->
          <div class="quiz-mastery-bar" id="quizMasteryBar" hidden>
            <span class="mastery-label">背诵自评：</span>
            <div class="mastery-buttons">
              <button type="button" class="mastery-btn btn-forgot" data-mastery="forgot" title="忘却生疏 (快捷键 1)">
                <span class="m-seal">生</span> 忘却生疏 <kbd class="quiz-kbd">1</kbd>
              </button>
              <button type="button" class="mastery-btn btn-vague" data-mastery="vague" title="偶有卡顿 (快捷键 2)">
                <span class="m-seal">疑</span> 偶有卡顿 <kbd class="quiz-kbd">2</kbd>
              </button>
              <button type="button" class="mastery-btn btn-mastered" data-mastery="mastered" title="了然于胸 (快捷键 3)">
                <span class="m-seal">熟</span> 了然于胸 <kbd class="quiz-kbd">3</kbd>
              </button>
            </div>
          </div>
        </div>

        <!-- Stanza Switcher Pills (Top of text) -->
        <div class="stanza-tabs-bar" id="stanzaTabsBar" aria-label="上下阕快速切换">
          <!-- Injected by app.js -->
        </div>

        <!-- Ci Stanzas & Sentences Container (Auto-scrolled) -->
        <div class="ci-text-container" id="ciTextContainer" role="region" aria-label="宋词全文与画意大句">
          <!-- Stanzas and Sentences rendered dynamically by app.js -->
        </div>

        <!-- Stanza-Segmented Stepper Progress Bar -->
        <div class="stanzas-stepper-box" id="stanzasStepperBox" aria-label="画意大句进阶导航">
          <!-- Injected by app.js -->
        </div>

        <!-- Whole Ci Appreciation -->
        <details class="ci-appreciation-details" id="ciAppreciationDetails" open>
          <summary class="appreciation-summary">
            <span class="summary-icon">✦</span>
            <span class="summary-title">词意探幽 · 全词赏析</span>
            <span class="summary-arrow">▾</span>
          </summary>
          <div class="appreciation-body" id="ciAppreciationBody">
            <!-- Injected by app.js -->
          </div>
        </details>

        <!-- Ci Pager Buttons -->
        <footer class="ci-footer-pager">
          <button type="button" id="prevCiBtn" class="pager-btn" title="上一首词 (快捷键 ←)">
            <span class="pager-arrow">←</span>
            <span class="pager-text" id="prevCiTitle">上一首</span>
          </button>
          <div class="ci-counter" id="ciCounter">1 / 100</div>
          <button type="button" id="nextCiBtn" class="pager-btn" title="下一首词 (快捷键 →)">
            <span class="pager-text" id="nextCiTitle">下一首</span>
            <span class="pager-arrow">→</span>
          </button>
        </footer>

      </article>
    </section>

    <!-- Right Column: Sentence Scene Artwork & In-depth Explanation -->
    <section class="artwork-column" id="artworkColumn">
      
      <!-- Artwork Card -->
      <div class="artwork-card">
        <div class="artwork-frame">
          <div class="artwork-loading" id="artworkLoading" role="status" aria-live="polite">
            <span class="artwork-loading-spinner" aria-hidden="true"></span>
            <span class="artwork-loading-label">正在加载配图…</span>
          </div>
          <img 
            id="sentenceIllustrationImg" 
            class="sentence-illustration-img" 
            src="" 
            alt="宋词意境画意"
          >
          <div class="artwork-overlay">
            <span class="artwork-sentence-badge" id="artworkSentenceBadge">上阕 · 第 1 句</span>
            <span class="artwork-poetic-focus" id="artworkPoeticFocus"></span>
          </div>
        </div>

        <!-- Active Sentence Explanation Card -->
        <div class="sentence-explanation-card">
          <div class="explanation-header">
            <span class="exp-seal">析</span>
            <div class="exp-title-group">
              <div class="exp-caption">当前画意大句详释</div>
              <div class="exp-sentence-text" id="expSentenceText"></div>
            </div>
          </div>

          <div class="exp-content">
            <!-- Modern Translation -->
            <div class="exp-section">
              <div class="exp-section-title">
                <span class="dot"></span>
                <span>白话译文</span>
              </div>
              <p class="exp-translation" id="expTranslation"></p>
            </div>

            <!-- Detailed Words & Allusions -->
            <div class="exp-section">
              <div class="exp-section-title">
                <span class="dot"></span>
                <span>词句释义与文化典故</span>
              </div>
              <div class="exp-words" id="expWords"></div>
            </div>
          </div>
        </div>

      </div>

    </section>

  </main>

  <!-- Bottom Floating Keyboard Navigation Helper -->
  <aside class="keyboard-nav-bar" aria-label="键盘操作指引">
    <div class="nav-hint-group">
      <span class="hint-item"><kbd>G</kbd> 挑战模式</span>
      <span class="hint-divider">·</span>
      <span class="hint-item"><kbd>Space</kbd> 翻开核对</span>
      <span class="hint-divider">·</span>
      <span class="hint-item"><kbd>H</kbd> 提示</span>
      <span class="hint-divider">·</span>
      <span class="hint-item"><kbd>1-3</kbd> 自评</span>
      <span class="hint-divider">·</span>
      <span class="hint-item"><kbd>↑</kbd> <kbd>↓</kbd> 逐句(移至解锁)</span>
      <span class="hint-divider">·</span>
      <span class="hint-item"><kbd>Tab</kbd> 换阕</span>
      <span class="hint-divider">·</span>
      <span class="hint-item"><kbd>←</kbd> <kbd>→</kbd> 切词</span>
      <span class="hint-divider">·</span>
      <span class="hint-item"><kbd>/</kbd> 搜索</span>
    </div>
  </aside>

  <!-- Full Catalog Drawer Modal -->
  <div id="catalogDrawer" class="catalog-drawer" hidden aria-hidden="true">
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <div class="drawer-content">
      <div class="drawer-header">
        <div class="drawer-title-group">
          <h2>宋词全卷全览</h2>
          <span class="drawer-subtitle">三十二首传世名篇精选 · 沉浸品鉴</span>
        </div>
        <button type="button" id="closeDrawerBtn" class="close-drawer-btn" aria-label="关闭目录">✕</button>
      </div>

      <!-- Quick Category Filter inside Drawer -->
      <div class="drawer-filter-pills" id="drawerFilterPills">
        <button type="button" class="drawer-pill active" data-filter="all">全部 (100)</button>
        <button type="button" class="drawer-pill" data-filter="豪放">豪放派</button>
        <button type="button" class="drawer-pill" data-filter="婉约">婉约派</button>
        <button type="button" class="drawer-pill" data-filter="小令">小令 (58字内)</button>
        <button type="button" class="drawer-pill" data-filter="中调">中调 (59-90字)</button>
        <button type="button" class="drawer-pill" data-filter="长调">长调 (91字以上)</button>
      </div>

      <div class="catalog-grid" id="catalogGrid">
        <!-- Rendered by app.js -->
      </div>
    </div>
  </div>

  <script src="data/ci.js"></script>
  <script src="app.js?v=20260919-r2-fallback"></script>
</body>
</html>
