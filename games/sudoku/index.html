<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8e1d5">
  <title>数独 · ReadForFun 游戏室</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="wordmark" href="../../"><img src="../../apple-touch-icon.png" alt="" width="30" height="30">ReadForFun</a>
      <a class="back-link" href="../">游戏室</a>
    </header>

    <main class="game-layout">
      <section class="game-intro" aria-labelledby="game-title">
        <p class="eyebrow">LOGIC LEDGER · 03</p>
        <h1 id="game-title">数独</h1>
        <p class="lede">九行、九列、九宫。每一个数字，都有它唯一的位置。</p>
        <div class="level-panel">
          <p>选择难度</p>
          <div class="level-switcher" role="group" aria-label="选择难度">
            <button type="button" data-level="easy" aria-pressed="true">简单</button>
            <button type="button" data-level="medium" aria-pressed="false">中等</button>
            <button type="button" data-level="hard" aria-pressed="false">困难</button>
          </div>
          <div class="assist-settings" aria-label="辅助设置">
            <div class="assist-setting">
              <span class="assist-setting__copy"><b>容错次数</b><small>答错后仍可继续</small></span>
              <div class="setting-stepper" role="group" aria-label="调整容错次数">
                <button type="button" data-setting="mistakes" data-delta="-1" aria-label="减少容错次数">−</button>
                <strong id="mistakeSettingValue" aria-live="polite">5</strong>
                <button type="button" data-setting="mistakes" data-delta="1" aria-label="增加容错次数">+</button>
              </div>
            </div>
            <div class="assist-setting">
              <span class="assist-setting__copy"><b>提示额度</b><small>自动填入一格</small></span>
              <div class="setting-stepper" role="group" aria-label="调整提示次数">
                <button type="button" data-setting="hints" data-delta="-1" aria-label="减少提示次数">−</button>
                <strong id="hintSettingValue" aria-live="polite">5</strong>
                <button type="button" data-setting="hints" data-delta="1" aria-label="增加提示次数">+</button>
              </div>
            </div>
          </div>
        </div>
        <div class="stats">
          <div><span>时间</span><strong id="timer">00:00</strong></div>
          <div><span>错误</span><strong><b id="mistakes">0</b> / <i id="mistakeMaximum">5</i></strong></div>
          <div><span>最佳</span><strong id="bestTime">—</strong></div>
        </div>
      </section>

      <section class="puzzle-station" aria-label="数独游戏">
        <div class="board-wrap">
          <div id="sudokuBoard" class="sudoku-board" role="grid" aria-label="9 乘 9 数独棋盘"></div>
          <div id="gameOverlay" class="game-overlay" hidden>
            <p id="overlayTitle">完成！</p>
            <span id="overlayText"></span>
            <button id="overlayAction" type="button">再来一局</button>
          </div>
        </div>

        <div id="numberPad" class="number-pad" aria-label="数字键盘">
          <button type="button" data-number="1">1<small></small></button>
          <button type="button" data-number="2">2<small></small></button>
          <button type="button" data-number="3">3<small></small></button>
          <button type="button" data-number="4">4<small></small></button>
          <button type="button" data-number="5">5<small></small></button>
          <button type="button" data-number="6">6<small></small></button>
          <button type="button" data-number="7">7<small></small></button>
          <button type="button" data-number="8">8<small></small></button>
          <button type="button" data-number="9">9<small></small></button>
        </div>
        <div class="tool-row">
          <button id="notesButton" type="button" aria-pressed="false"><span>✎</span> 笔记</button>
          <button id="eraseButton" type="button"><span>⌫</span> 擦除</button>
          <button id="hintButton" type="button"><span>✦</span> 提示 <b id="hintCount">5</b></button>
          <button id="newGame" type="button"><span>↻</span> 新局</button>
        </div>
        <p id="gameStatus" class="game-status" aria-live="polite">简单数独已生成。选择空格并填入数字。</p>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
