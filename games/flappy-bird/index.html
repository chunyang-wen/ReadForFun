<!doctype html>
<html lang="zh-CN">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-KMX9Z6VWBX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-KMX9Z6VWBX');
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#26362f">
  <title>Flappy Bird · ReadForFun 游戏室</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="gameShell" class="game-shell" aria-labelledby="game-title">
    <div id="gameFrame" class="game-frame">
      <canvas id="gameCanvas" width="960" height="540" tabindex="0" role="application" aria-label="Flappy Bird 横屏游戏画面。按空格键、向上方向键或点击画面拍动翅膀。"></canvas>
      <header class="game-hud">
        <a class="back-link" href="../" aria-label="返回游戏室">← <span>游戏室</span></a>
        <div class="game-title">
          <span>PAPER FLIGHT · 02</span>
          <h1 id="game-title">Flappy Bird</h1>
        </div>
        <div class="hud-actions">
          <button id="soundToggle" type="button" aria-pressed="true" aria-label="关闭声音"><span aria-hidden="true">♪</span><b>声音</b></button>
          <button id="fullscreenButton" type="button" aria-label="进入全屏"><span aria-hidden="true">⛶</span><b>全屏</b></button>
          <button id="pauseButton" type="button" aria-label="暂停游戏" hidden><span aria-hidden="true">Ⅱ</span><b>暂停</b></button>
        </div>
      </header>
      <div class="scorebar" aria-label="飞行成绩">
        <div><span>本局</span><strong id="score">0</strong></div><i></i>
        <div><span>最佳</span><strong id="bestScore">0</strong></div>
      </div>
      <div id="gameOverlay" class="game-overlay">
        <div class="overlay-mark" aria-hidden="true">↟</div>
        <p id="overlayTitle">准备起飞</p>
        <span id="overlayText">轻点画面，穿过书脊之间的空隙</span>
        <button id="actionButton" type="button">开始飞行</button>
        <small>空格 / ↑ / 点击画面</small>
      </div>
      <button id="mobileFlap" class="flap-button" type="button" aria-label="拍动翅膀"><span aria-hidden="true">↑</span><b>拍动</b></button>
      <p id="gameStatus" class="visually-hidden" aria-live="polite">准备起飞。按开始飞行按钮进入游戏。</p>
      <div class="landscape-hint" aria-hidden="true"><span>↻</span> 横过手机，飞得更自在</div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
