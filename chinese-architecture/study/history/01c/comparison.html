<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>佛光寺东大殿 · 同机位对照</title><link rel="stylesheet" href="style.css"><style>.pairs{display:grid;grid-template-columns:1fr 1fr;gap:20px}.pairs img{width:100%;height:auto}figure{margin:0}figcaption{line-height:1.8;padding:12px 0} @media(max-width:720px){.pairs{grid-template-columns:1fr}} .wide{width:100%}</style><body><header><a href="./?mode=d&view=patch">进入可交互实验 ↗</a><span>最终参数版本 01c · 2026.10.15</span></header><main><h1>同一机位，分条件比较</h1><p>对照对象为模型本身；照片相机尚未配准，不用于像素还原度判断。原始全页截图与状态日志保存在 runs/01c。</p><img class="wide" src="comparison.jpg" alt="左A基线，右D局部灰瓦与照明实验，同一机位"><p>左 A：原卷几何、材料与照明；右 D：灰瓦局部几何、材料及照明的累积变化。须用下列中间条件分辨变化来源。</p><div class="pairs"><figure><img src="runs/01c/desktop/front-b.jpg" alt="B材料条件"><figcaption>B：只改材料；仍保留原几何、原照明。</figcaption></figure><figure><img src="runs/01c/desktop/front-c.jpg" alt="C瓦片几何条件"><figcaption>C：在B上只改局部几何；逐瓦色差关闭。</figcaption></figure><figure><img src="runs/01c/desktop/oblique-d.jpg" alt="最终斜侧"><figcaption>斜侧仍可见新旧瓦作交界；未完成整屋面连续化。</figcaption></figure><figure><img src="runs/01c/desktop/lift-d.jpg" alt="抬升屋面"><figcaption>屋面与样片共同抬升，椽架保持原位。这是图层归属检查。</figcaption></figure></div><p>结论：独立瓦段与槽形板瓦提高了局部可读性；整体体量、围护、铺作及装饰仍有待核问题。<a href="RESEARCH.md">完整研究记录</a></p></main></body></html>
