<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>唐诗之境 · 诗画合集 · 逐句画意与互动赏析</title>
  <meta name="description" content="精选50首传世唐诗，字字精准拼音，每句专属国风意境配图与白话详释。支持键盘上下键逐句沉浸式联动切换，多维诗人与诗句内容检索。">
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-paper pinyin-enabled">

  <!-- Paper Grain Ambient Texture -->
  <div class="paper-texture" aria-hidden="true"></div>

  <!-- App Header & Navigation -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-section">
        <a href="../" class="bookshelf-back" title="返回 ReadForFun 故事书架">
          <span class="back-arrow">←</span>
          <span class="back-text">书架</span>
        </a>
        <div class="brand-seal" aria-hidden="true">唐</div>
        <div class="brand-titles">
          <h1>唐诗之境</h1>
          <span class="brand-sub">诗画合集 · 五十首传世精粹</span>
        </div>
      </div>

      <!-- Search Input Container -->
      <div class="search-section">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input 
            type="search" 
            id="searchInput" 
            class="search-input" 
            placeholder="搜索诗人、诗名或诗句（如：悯农、李白、盘中餐、明月光）" 
            autocomplete="off"
            aria-label="搜索唐诗"
          >
          <button type="button" id="clearSearchBtn" class="clear-search-btn" title="清空搜索" aria-label="清空">✕</button>
          <kbd class="search-shortcut" title="按 / 键快速搜索">/</kbd>
        </div>

        <!-- Search Live Results Dropdown -->
        <div id="searchResultsPanel" class="search-results-panel" hidden>
          <div class="search-results-header">
            <span id="searchResultCount">输入关键词即可检索</span>
            <span class="search-tip">支持诗人、诗名、诗句、拼音检索</span>
          </div>
          <div id="searchResultsList" class="search-results-list" role="listbox"></div>
        </div>
      </div>

      <!-- Header Action Controls -->
      <div class="header-actions">
        <!-- Pinyin Toggle -->
        <button type="button" id="pinyinToggleBtn" class="action-btn" title="切换拼音标注 (快捷键 P)" aria-pressed="true">
          <span class="btn-icon">pī</span>
          <span class="btn-label">拼音</span>
        </button>

        <!-- Catalog Drawer Button -->
        <button type="button" id="catalogBtn" class="action-btn" title="打开诗集全览目录 (快捷键 M)">
          <span class="btn-icon">卷</span>
          <span class="btn-label">全卷 (50)</span>
        </button>

        <!-- Random Poem Button -->
        <button type="button" id="randomPoemBtn" class="action-btn" title="随机漫游一首诗 (快捷键 R)">
          <span class="btn-icon">🎲</span>
          <span class="btn-label">随机</span>
        </button>

        <!-- Theme Toggle -->
        <button type="button" id="themeToggleBtn" class="action-btn" title="切换宣纸白昼/幽夜静思模式">
          <span class="btn-icon theme-icon">🌙</span>
        </button>
      </div>
    </div>

    <!-- Poet Filter Chips Bar -->
    <nav class="poet-filter-bar" aria-label="按诗人检索">
      <div class="filter-label">诗人检索：</div>
      <div id="poetChipsContainer" class="poet-chips-scroll">
        <!-- Dynamic chips generated by app.js -->
      </div>
    </nav>
  </header>

  <!-- Main Poetry Reader Stage -->
  <main class="reader-stage" id="readerStage">
    
    <!-- Left Column: Verses & Interaction -->
    <section class="verses-column">
      <article class="poem-card">
        
        <!-- Poem Header -->
        <div class="poem-header">
          <div class="poem-badge-row">
            <span class="poem-dynasty-badge">唐代</span>
            <span class="poem-form-badge" id="poemFormBadge">五言绝句</span>
            <span class="poem-tags-list" id="poemTagsList"></span>
          </div>
          
          <h2 class="poem-title" id="poemTitle">
            <!-- Rendered with ruby pinyin by app.js -->
          </h2>
          
          <div class="poem-author-row">
            <span class="poet-name" id="poetName"></span>
            <span class="poet-seal" id="poetSeal">印</span>
          </div>
        </div>

        <!-- Verses List -->
        <div class="verses-list" id="versesList" role="region" aria-label="诗文逐句">
          <!-- Lines rendered dynamically by app.js -->
        </div>

        <!-- Line Navigation Indicators -->
        <div class="line-stepper" id="lineStepper" aria-label="诗句定位导航">
          <!-- Step dots rendered by app.js -->
        </div>

        <!-- Whole Poem Appreciation -->
        <details class="poem-appreciation-details" id="poemAppreciationDetails" open>
          <summary class="appreciation-summary">
            <span class="summary-icon">✦</span>
            <span class="summary-title">意境探幽 · 全诗赏析</span>
            <span class="summary-arrow">▾</span>
          </summary>
          <div class="appreciation-body" id="poemAppreciationBody">
            <!-- Injected by app.js -->
          </div>
        </details>

        <!-- Poem Pager Buttons -->
        <footer class="poem-footer-pager">
          <button type="button" id="prevPoemBtn" class="pager-btn" title="上一首诗 (快捷键 ←)">
            <span class="pager-arrow">←</span>
            <span class="pager-text" id="prevPoemTitle">上一首</span>
          </button>
          <div class="poem-counter" id="poemCounter">1 / 50</div>
          <button type="button" id="nextPoemBtn" class="pager-btn" title="下一首诗 (快捷键 →)">
            <span class="pager-text" id="nextPoemTitle">下一首</span>
            <span class="pager-arrow">→</span>
          </button>
        </footer>

      </article>
    </section>

    <!-- Right Column: Line-by-Line Illustration & In-depth Explanation -->
    <section class="artwork-column">
      
      <!-- Artwork Container -->
      <div class="artwork-card">
        <div class="artwork-frame">
          <div class="artwork-loading" id="artworkLoading" role="status" aria-live="polite">
            <span class="artwork-loading-spinner" aria-hidden="true"></span>
            <span class="artwork-loading-label">正在加载配图…</span>
          </div>
          <img 
            id="lineIllustrationImg" 
            class="line-illustration-img" 
            src="" 
            alt="唐诗意境配图"
          >
          <div class="artwork-overlay">
            <span class="artwork-line-badge" id="artworkLineBadge">第 1 句</span>
            <span class="artwork-poetic-focus" id="artworkPoeticFocus"></span>
          </div>
        </div>

        <!-- Active Line Explanation Card -->
        <div class="line-explanation-card">
          <div class="explanation-header">
            <span class="exp-seal">析</span>
            <div class="exp-title-group">
              <div class="exp-caption">当前诗句赏析与译释</div>
              <div class="exp-line-text" id="expLineText"></div>
            </div>
          </div>

          <div class="exp-content">
            <!-- Modern Translation -->
            <div class="exp-section">
              <div class="exp-section-title">
                <span class="dot"></span>
                <span>白话译文</span>
              </div>
              <p class="exp-translation" id="expTranslation"></p>
            </div>

            <!-- Detailed Word Annotation -->
            <div class="exp-section">
              <div class="exp-section-title">
                <span class="dot"></span>
                <span>字词释义与文化常识</span>
              </div>
              <div class="exp-words" id="expWords"></div>
            </div>
          </div>
        </div>

      </div>

    </section>

  </main>

  <!-- Bottom Floating Keyboard Navigation Helper -->
  <aside class="keyboard-nav-bar" aria-label="键盘操作指引">
    <div class="nav-hint-group">
      <span class="hint-item"><kbd>↑</kbd> <kbd>↓</kbd> 逐句切换</span>
      <span class="hint-divider">·</span>
      <span class="hint-item"><kbd>←</kbd> <kbd>→</kbd> 切换诗作</span>
      <span class="hint-divider">·</span>
      <span class="hint-item"><kbd>/</kbd> 聚焦搜索</span>
      <span class="hint-divider">·</span>
      <span class="hint-item"><kbd>P</kbd> 拼音开关</span>
      <span class="hint-divider">·</span>
      <span class="hint-item"><kbd>M</kbd> 诗集目录</span>
    </div>
  </aside>

  <!-- Full Catalog Drawer Modal -->
  <div id="catalogDrawer" class="catalog-drawer" hidden aria-hidden="true">
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <div class="drawer-content">
      <div class="drawer-header">
        <div class="drawer-title-group">
          <h2>唐诗全卷全览</h2>
          <span class="drawer-subtitle">五十首传世名篇精选 · 逐首品鉴</span>
        </div>
        <button type="button" id="closeDrawerBtn" class="close-drawer-btn" aria-label="关闭目录">✕</button>
      </div>

      <!-- Quick Category Filter inside Drawer -->
      <div class="drawer-filter-pills" id="drawerFilterPills">
        <button type="button" class="drawer-pill active" data-filter="all">全部 (50)</button>
        <button type="button" class="drawer-pill" data-filter="五言绝句">五言绝句</button>
        <button type="button" class="drawer-pill" data-filter="七言绝句">七言绝句</button>
        <button type="button" class="drawer-pill" data-filter="五言律诗">五言律诗</button>
        <button type="button" class="drawer-pill" data-filter="七言律诗">七言律诗</button>
      </div>

      <div class="catalog-grid" id="catalogGrid">
        <!-- Rendered by app.js -->
      </div>
    </div>
  </div>

  <script src="data/poems.js"></script>
  <script src="app.js"></script>
</body>
</html>
